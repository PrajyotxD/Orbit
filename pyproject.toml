[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-rag"
version = "0.1.0"
description = "Orbit: an evidence-driven, local-first retrieval engine with verifiable source references."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Prajyot" }]
keywords = ["rag", "retrieval", "search", "evidence", "mcp", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]

# Core dependencies are deliberately minimal. Orbit's default configuration runs
# entirely offline: lexical retrieval via SQLite FTS5, vector retrieval via a
# deterministic built-in embedder, storage via the stdlib sqlite3 module.
#
# numpy (BSD-3-Clause) is the single runtime dependency: exact vector search over
# float32 blobs is unusable in pure Python at realistic corpus sizes. Everything
# else is optional and lazily imported.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Real neural embeddings (downloads a model from Hugging Face on first use).
embeddings = ["transformers>=4.40", "torch>=2.0"]
# MCP server for agent tool access.
mcp = ["mcp>=1.0"]
# Richer document parsing.
parsing = ["PyYAML>=6.0", "Markdown>=3.5", "beautifulsoup4>=4.12", "lxml>=5.0"]
# Answer generation against a local or OpenAI-compatible HTTP endpoint.
llm = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
docs = ["pdoc>=14.0"]

[project.scripts]
orbit = "orbit.cli:main"

[project.urls]
Homepage = "https://github.com/PrajyotxD/Orbit"
Documentation = "https://github.com/PrajyotxD/Orbit/tree/main/docs"
Issues = "https://github.com/PrajyotxD/Orbit/issues"
Changelog = "https://github.com/PrajyotxD/Orbit/commits/main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:orbit.*"]
markers = [
    "integration: end-to-end tests that exercise the full index+search pipeline",
    "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "ARG", "PL"]
ignore = ["PLR0912", "PLR0915", "PLR2004", "RET504", "SIM105"]

[tool.mypy]
python_version = "3.10"
packages = ["orbit"]
ignore_missing_imports = true
warn_unused_ignores = false
strict_optional = true
